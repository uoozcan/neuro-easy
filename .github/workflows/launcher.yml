name: Launcher tests only
on: [push, pull_request]
jobs:
  offline-launcher:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: bash -n start.sh
